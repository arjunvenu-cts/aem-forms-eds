trigger:
  branches:
    include:
      - main
pr: none

pool:
  vmImage: ubuntu-latest

variables:
  - group: github-sync

steps:
  - checkout: self
    fetchDepth: 0

  - bash: |
      set -euo pipefail
      git remote add target "https://${GITHUB_USER}:${GITHUB_PAT}@${GITHUB_REPO}"
      git push target HEAD:refs/heads/main --force
      git push target --tags
    displayName: Push to Git repo
    env:
      GITHUB_PAT: $(GITHUB_PAT)