trigger:
  branches:
    include:
      - main          # the branch your PRs merge into
pr: none

pool:
  vmImage: ubuntu-latest

variables:
  - group: github-sync

steps:
  - checkout: self
    fetchDepth: 0     # full history, required for pushing

  - bash: |
      git remote add target "https://arjunvenu-cts:REMOVED_SECRET@aem-forms-eds"
      git push target HEAD:refs/heads/main
      git push target --tags
    displayName: Push to Git repo
    env:
      GITHUB_PAT: REMOVED_SECRET