steps:
  - checkout: none

  - task: DownloadSecureFile@1
    name: appKey
    inputs:
      secureFile: 'ado-aap-github.2026-11-13.private-key.pem'

  - script: |
      set -e
      b64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
      now=$(date +%s)
      header=$(printf '{"alg":"RS256","typ":"JWT"}' | b64)
      payload=$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' $((now-60)) $((now+540)) "$APP_ID" | b64)
      sig=$(printf '%s.%s' "$header" "$payload" | openssl dgst -sha256 -sign "$KEY_PATH" | b64)
      jwt="$header.$payload.$sig"

      token=$(curl -sf -X POST \
        -H "Authorization: Bearer $jwt" -H "Accept: application/vnd.github+json" \
        https://api.github.com/app/installations/$INSTALL_ID/access_tokens | jq -r .token)

      git -c http.extraheader="AUTHORIZATION: bearer $SYSTEM_ACCESSTOKEN" \
        clone --mirror "$(Build.Repository.Uri)" repo.git
      cd repo.git
      git push --prune "https://x-access-token:${token}@github.com/Cognizant-Moment-AAP/Accl3-dev1.git" \
        '+refs/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*'
    displayName: Mirror to GitHub
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      APP_ID: $(GH_APP_ID)
      INSTALL_ID: $(GH_INSTALLATION_ID)
      KEY_PATH: $(appKey.secureFilePath)
