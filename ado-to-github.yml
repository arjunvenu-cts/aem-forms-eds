trigger:
  branches:
    include:
      - main          # the branch your PRs merge into
pr: none

pool:
  vmImage: ubuntu-latest

variables:
  - group: ado-github-sync

steps:
  - checkout: self
    fetchDepth: 0     # full history, required for pushing

  - bash: |
      git remote add target "https://${GITHUB_USER}:${GITHUB_PAT}@${GITHUB_REPO}"
      git push target HEAD:refs/heads/main --force
      git push target --tags --force
    displayName: Push to Git repo
    env:
      GITHUB_PAT: $(GITHUB_PAT)